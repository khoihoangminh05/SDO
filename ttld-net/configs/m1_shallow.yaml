# M1 — Shallow features + Soft-NMS + low confidence threshold

model:
  backbone: yolo26
  mode: shallow
  use_shallow_features: true
  use_soft_nms: true
  heads:
    - tiny_generator

training:
  epochs: 100
  batch_size: 32
  optimizer: AdamW
  lr: 1.0e-4
  warmup_epochs: 5

loss:
  lambda1: 0.0
  lambda2: 0.0
  focal_gamma: 2.0
  focal_alpha: 0.25

data:
  ultralytics_yaml: ../apps/worker/datasets/bstld.yaml
  conf_threshold: 0.05
  soft_nms_sigma: 0.5
  num_workers: 4

heads:
  tiny_generator:
    conf_threshold: 0.05
    soft_nms_sigma: 0.5
    fcand_dim: 256
