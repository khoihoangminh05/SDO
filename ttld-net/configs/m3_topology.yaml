# M3 — M2 + Implicit Topology Sampler (no InfoNCE / verification yet)

model:
  backbone: yolo26
  neck: fpn_panet
  mode: topology
  use_shallow_features: true
  use_soft_nms: true
  heads:
    - tiny_generator
    - implicit_topo_sampler

training:
  epochs: 100
  batch_size: 4
  val_batch_size: 2
  max_candidates: 400
  use_amp: true
  lr: 1.0e-4

loss:
  lambda1: 1.0
  lambda2: 0.0
  focal_gamma: 1.5
  focal_alpha: 0.75
  infonce_temperature: 0.07

data:
  ultralytics_yaml: ../apps/worker/datasets/bstld.yaml
  train_yaml: ../apps/worker/datasets/dataset_train_rgb/train.yaml
  val_yaml: ../apps/worker/datasets/dataset_val_sample/rgb/val
  conf_threshold: 0.05
  soft_nms_sigma: 0.5
  eval_conf_threshold: 0.5
  num_workers: 4

topology:
  n_points: 4
  n_heads: 8
  d_model: 256
