# TTLD-Net conda environment (GPU server — Linux recommended)
# Create:  conda env create -f environment.yml
# Activate: conda activate ttld-net

name: ttld-net
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pip
  - pytorch>=2.1.0
  - torchvision>=0.16.0
  - pytorch-cuda=12.1
  - pip:
      - -r requirements.txt
      # MMCV — install AFTER env activate, matching CUDA + torch:
      # pip install mmcv==2.1.0 -f https://download.openmmlab.com/mmcv/dist/cu121/torch2.1.0/index.html
      # Verify: python -c "from mmcv.ops import MultiScaleDeformableAttention; print('OK')"
