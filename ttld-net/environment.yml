# TTLD-Net conda environment (GPU server — Linux)
#
# BEFORE create: free disk space (need ~15 GB free)
#   conda clean -a -y && pip cache purge
#   df -h ~
#
# Create:
#   conda env create -f environment.yml
# Activate:
#   conda activate ttld-net
# Then MMCV:
#   python scripts/install_mmcv.py --run

name: ttld-net
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pip
  - pytorch=2.1.*
  - torchvision=0.16.*
  - pytorch-cuda=12.1
  - pip:
      - -r requirements-server.txt
