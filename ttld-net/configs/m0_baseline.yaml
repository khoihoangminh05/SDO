# M0 — YOLO baseline (no TTLD modifications)

model:
  backbone: yolo26
  mode: baseline
  use_shallow_features: false
  use_soft_nms: false
  heads: []

training:
  epochs: 50
  batch_size: 16
  optimizer: AdamW
  lr: 1.0e-4
  scheduler: CosineAnnealing
  warmup_epochs: 5
  grad_clip_norm: 1.0

loss:
  lambda1: 0.0
  lambda2: 0.0
  focal_gamma: 2.0
  focal_alpha: 0.25

data:
  ultralytics_yaml: ../apps/worker/datasets/bstld.yaml
  train_yaml: ../apps/worker/datasets/dataset_train_rgb/train.yaml
  val_yaml: ../apps/worker/datasets/dataset_val_sample/val.yaml
  conf_threshold: 0.25
  eval_conf_threshold: 0.5
  soft_nms_sigma: 0.5
  num_workers: 4
  pin_memory: true
