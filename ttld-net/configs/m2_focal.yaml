# M2 — M1 + Focal Loss tuning (gamma=1.5, alpha=0.75)

model:
  backbone: yolo26
  mode: shallow_focal
  use_shallow_features: true
  use_soft_nms: true
  heads:
    - tiny_generator

training:
  epochs: 100
  batch_size: 32
  lr: 1.0e-4

loss:
  lambda1: 0.0
  lambda2: 0.0
  focal_gamma: 1.5
  focal_alpha: 0.75

data:
  conf_threshold: 0.05
  soft_nms_sigma: 0.5
